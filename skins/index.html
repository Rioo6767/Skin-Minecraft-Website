<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050507">
<title>NexoMC Skin — Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.skin-page-main{position:relative;z-index:2;max-width:1200px;margin:auto;padding:72px 22px 100px}
.skin-page-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}
.skin-page-head h1{font-size:clamp(38px,6vw,66px);line-height:1.03;margin-top:10px}
.skin-page-head h1 em{font-style:normal;color:#9b6cff}
.skin-page-head p{color:var(--muted);max-width:680px;line-height:1.7;margin-top:14px}
.skin-back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:11px 15px;border-radius:12px;font-weight:700;white-space:nowrap}
.skin-toolbar{display:grid;grid-template-columns:minmax(0,1fr) 190px 150px;gap:10px;margin-bottom:28px}
.skin-search,.skin-select{height:48px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);outline:none;padding:0 15px;font:600 13px Inter,system-ui,sans-serif;backdrop-filter:blur(14px)}
.skin-search{padding-left:43px}
.search-wrap{position:relative}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:16px}
.skin-search::placeholder{color:var(--muted)}
.skin-search:focus,.skin-select:focus{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 3px rgba(139,92,246,.08)}
.skin-result{color:var(--muted);font:10px monospace;letter-spacing:1.2px;text-transform:uppercase;margin:0 0 12px}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}
.skin-card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;backdrop-filter:blur(16px);transition:.3s}
.skin-card:hover{transform:translateY(-6px);border-color:rgba(155,108,255,.45);box-shadow:0 20px 50px rgba(0,0,0,.28)}
.skin-preview{aspect-ratio:1/1.15;background:rgba(255,255,255,.025);overflow:hidden}
.skin-preview img{width:100%;height:100%;object-fit:cover;display:block;transition:.45s}
.skin-card:hover .skin-preview img{transform:scale(1.035)}
.skin-info{padding:18px}
.skin-tag{font-size:10px;letter-spacing:.14em;color:#a987ff;font-weight:800}
.skin-info h2{font-size:20px;margin:8px 0 7px}
.skin-info p{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:15px}
.skin-download{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:#111;background:#fff;padding:12px;border-radius:12px;font-weight:800;transition:.25s}
.skin-download:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(255,255,255,.1)}
.skin-empty{grid-column:1/-1;padding:60px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}
.skin-count{display:inline-flex;align-items:center;gap:7px;margin-top:8px;color:var(--muted);font:10px monospace;letter-spacing:1px}
.skin-count i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
@media(max-width:720px){.skin-toolbar{grid-template-columns:1fr 1fr}.search-wrap{grid-column:1/-1}.skin-page-head{display:block}.skin-back{margin-top:20px}}
@media(max-width:520px){.skin-page-main{padding:48px 14px 70px}.skin-grid{grid-template-columns:1fr 1fr;gap:12px}.skin-info{padding:13px}.skin-info h2{font-size:15px}.skin-info p{font-size:10px}.skin-download{font-size:11px;padding:10px 5px}.skin-tag{font-size:8px}.skin-select{padding:0 9px;font-size:11px}}
</style>
</head>
<body>
<canvas id="networkCanvas" aria-hidden="true"></canvas>
<div class="page-glow glow-a"></div><div class="page-glow glow-b"></div><div class="grid-bg"></div>

<header class="topbar">
  <a class="brand" href="../" aria-label="NexoMC home">
    <span class="brand-mark"><span></span><span></span></span>
    <span><strong>NexoMC</strong><small><i></i> MINECRAFT COLLECTION</small></span>
  </a>
  <nav class="desktop-nav">
    <a href="#collection">Collection</a><a href="../#features">Why NexoMC</a><a href="../#footer">About</a>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" aria-label="Ganti tema">◐</button>
    <a class="deploy-btn" href="../" target="_self"><span>←</span> NexoMC Home <b>↗</b></a>
  </div>
</header>

<main class="skin-page-main" id="collection">
  <section class="skin-page-head">
    <div>
      <div class="eyebrow"><span class="pulse"></span> NEXOMC COLLECTION</div>
      <h1>Your next <em>Minecraft Skin.</em></h1>
      <p>Koleksi skin Minecraft NexoMC. Cari, filter kategori, lalu pilih skin yang ingin kamu download.</p>
    </div>
    <a class="skin-back" href="../">← Kembali ke NexoMC</a>
  </section>

  <section class="skin-toolbar" aria-label="Filter skin">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="skinSearch" class="skin-search" type="search" placeholder="Cari nama skin..." autocomplete="off">
    </div>
    <select id="skinCategory" class="skin-select" aria-label="Kategori">
      <option value="all">Semua Kategori</option>
    </select>
    <select id="skinSort" class="skin-select" aria-label="Urutkan">
      <option value="newest">Terbaru</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
    </select>
  </section>

  <div class="skin-result" id="skinResult">0 SKIN</div>
  <section class="skin-grid" id="skinGrid"></section>
</main>

<footer class="skin-page-footer">© 2026 NEXOMC NETWORK. ENGINEERED FOR MINECRAFT.</footer>

<script src="../config.js"></script>
<script src="../data/skins.js"></script>
<script>
(function(){
  const allSkins = Array.isArray(window.NEXOMC_SKINS) ? window.NEXOMC_SKINS : [];
  const grid = document.getElementById('skinGrid');
  const result = document.getElementById('skinResult');
  const search = document.getElementById('skinSearch');
  const category = document.getElementById('skinCategory');
  const sort = document.getElementById('skinSort');
  const themeBtn = document.getElementById('themeBtn');

  const categories = [...new Set(allSkins.map(s => s.category || 'Minecraft Skin'))].sort();
  categories.forEach(c => {
    const opt=document.createElement('option');
    opt.value=c; opt.textContent=c;
    category.appendChild(opt);
  });

  function render(){
    const q=search.value.trim().toLowerCase();
    const cat=category.value;
    let list=allSkins.filter(s=>{
      const name=(s.name||'').toLowerCase();
      const c=s.category||'Minecraft Skin';
      return (!q || name.includes(q)) && (cat==='all' || c===cat);
    });
    if(sort.value==='az') list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    if(sort.value==='za') list.sort((a,b)=>(b.name||'').localeCompare(a.name||''));
    result.textContent=list.length+' SKIN'+(list.length===1?'':'S');
    grid.innerHTML=list.length ? list.map(s=>`
      <article class="skin-card">
        <div class="skin-preview"><img src="${s.image}" alt="${s.name}" loading="lazy"></div>
        <div class="skin-info">
          <div class="skin-tag">${s.category||'MINECRAFT SKIN'}</div>
          <h2>${s.name}</h2>
          <p>Ready-to-use Minecraft skin dari NexoMC Collection.</p>
          <a class="skin-download" href="${s.download}" target="_blank" rel="noopener noreferrer">DOWNLOAD PNG <span>↗</span></a>
        </div>
      </article>`).join('') :
      '<div class="skin-empty">Skin yang kamu cari belum ditemukan.</div>';
  }

  [search,category,sort].forEach(el=>el.addEventListener('input',render));
  const saved=localStorage.getItem('nexomc-theme')||'dark';
  document.body.classList.toggle('light',saved==='light');
  themeBtn.onclick=()=>{
    const light=!document.body.classList.contains('light');
    document.body.classList.toggle('light',light);
    localStorage.setItem('nexomc-theme',light?'light':'dark');
  };
  render();
})();
</script>
<script src="../js/app.js"></script>
</body>
</html>
